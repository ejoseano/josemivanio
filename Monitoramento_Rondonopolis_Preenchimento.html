<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoramento Unidade Rondonópolis – Detalhamento de Produção Diária</title>
<style>
:root{--bg:#e9ecef;--ink:#111;--bar:#404040;--yel:#ffff00;--line:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Calibri,Carlito,Arial,sans-serif;color:var(--ink);padding:10px 8px 84px}
.sheet{background:#fff;max-width:1100px;margin:0 auto;font-size:13px;box-shadow:0 1px 6px #0003}
.sheet.pdf{width:1100px;max-width:none;box-shadow:none}
.head{display:flex;align-items:center;background:#000;color:#fff}
.head img{height:62px;display:block}
.head h1{flex:1;margin:0;text-align:center;font-weight:400;font-size:clamp(14px,3.2vw,22px);padding:0 8px}
.sub{background:var(--bar);color:#fff;text-align:center;font-weight:700;font-size:12px;padding:1px 0;border-top:1px solid #777}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;background:#fff}
.sheet.pdf .panels{grid-template-columns:1fr 1fr}
@media(max-width:760px){.panels{grid-template-columns:1fr;gap:10px 0}.sheet.pdf .panels{grid-template-columns:1fr 1fr;gap:0 8px}}
.ref{display:flex;background:var(--bar);color:#fff;border:1px solid var(--line)}
.ref .lb{width:80px;text-align:center;padding:1px 0;border-right:1px solid #888}
.ref .dt{flex:1;text-align:center;background:var(--bar);color:#fff}
.ref input,.ref span.dt{font:inherit;color:#fff;background:transparent;border:0;text-align:center;width:100%;padding:1px}
.ref input::-webkit-calendar-picker-indicator{filter:invert(1)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{border:1px solid var(--line);padding:0 3px;height:21px;text-align:center;overflow:hidden;white-space:nowrap}
tr.hd td{background:#fff}
tr.hd td:nth-child(2),td.prod{font-weight:700}
td.pista{font-weight:700;font-size:11.5px;white-space:normal;line-height:1.15}
td.nm{font-weight:400}
tr.team td{font-weight:700}
tr.team td.e0{border:0;border-right:1px solid var(--line);border-left:0}
.bar{height:9px;background:var(--bar);border:1px solid var(--line);border-top:0}
.obra{display:flex;background:var(--bar);color:#fff;border:1px solid var(--line)}
.obra span{flex:1;text-align:center;padding:1px 0}
.obra b{width:16%;text-align:center;background:var(--yel);color:#000;font-weight:400;padding:1px 0}
td input,td span.v{width:100%;font:inherit;text-align:center;border:0;background:transparent;padding:0;display:block;height:20px;line-height:20px;color:inherit}
td.in{background:var(--yel)}
td.in input,td.in span.v{font-weight:400}
td input:focus{outline:2px solid #1a73e8;outline-offset:-2px;background:#fffbe0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#fffe;border-top:1px solid #ccc;backdrop-filter:blur(4px)}
button{font:600 15px Calibri,Carlito,Arial,sans-serif;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
#btnShare{background:#0b57d0;color:#fff;flex:1;max-width:360px}
#btnClear{background:#fff;color:#333;border:1px solid #999}
button:disabled{opacity:.6}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* ---- Formulário simples ---- */
.app{max-width:560px;margin:0 auto}
.app h2{margin:4px 0 10px;font-size:22px}
.step{font-size:15px;font-weight:700;color:#333;margin:16px 2px 6px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0002;overflow:hidden;margin-bottom:12px}
.card h3{margin:0;padding:10px 14px;font-size:17px;color:#fff;background:#0b57d0;letter-spacing:.3px}
.card.arm h3{background:#2e7d32}
.grp{background:#222;color:#fff;font-weight:700;font-size:16px;padding:8px 14px;border-radius:10px;margin:14px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #eee}
.row .n{flex:1;font-size:17px;font-weight:600}
.row .n small{display:block;font-weight:400;font-size:13px;color:#666}
.row input{width:96px;height:50px;font-size:24px;font-weight:700;text-align:center;border:2px solid #bbb;border-radius:10px;background:#fffbd0}
.row input:focus{outline:0;border-color:#0b57d0;background:#ffff66}
.row .ef{width:52px;text-align:right;font-size:15px;font-weight:700;color:#555}
.date{width:100%;height:54px;font-size:22px;text-align:center;border:2px solid #bbb;border-radius:10px;background:#fff}
.res{display:flex;gap:8px}
.res div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 4px #0002}
.res b{display:block;font-size:26px;color:#0b57d0}
.res span{font-size:13px;color:#555}
#hid{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#fffe;border-top:1px solid #ccc;backdrop-filter:blur(4px)}
#btnShare{flex:1;max-width:520px;font-size:19px;padding:16px}
</style>
</head>

67rJqStJaNf10OavQ9hJOLvF6phRRRXWcoUUUUAFFFFABTHbtTmbbUdBcV1JaKKKCAooooAKKKKACiiigAooooARVVRhVCj0UYpaKKBvXVhRRRQIKnsL660u+gvbG5msr23cSw3Nu5jkjcdGVhyCPXNQUVLSe403F3W57jH8dvCnxMijt/jD4Wn1DUlQRp4y8MeXbamQMY+0RMPKuDwPmOGAHcnNQXXwY+HOtx/aPCfxs8PvGQG+zeJbK602aPJ+62EkDYHVl4z9a8VpkkEcn3kUn1xXG8K4/wpuK7dPx2O/wCtRmrVoJvv1/A9w1jxF4L+C/w58U+HPCfiRvGnizxRarp19qVrbPb2FjaiQO8cQkAaWR2VRvKhQuccjnxFc7Rn0pscMcZyqKPwH5U+tqVFUr3d2+pjWre0SilZIKKKK6DlCiiigAo7UUx27CgaV2NJzRRSqMmg22JKKKKDAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiipTHHYKKKKIiCiiiqAKKKKAEaovWiig1iLT46KKByP/2Q=="><h1>MONITORAMENTO UNIDADE RONDONÓPOLIS</h1></div>
  <div class="sub">DETALHAMENTO DE PRODUÇÃO DIÁRIA</div>
  <div class="panels" id="panels"></div>
</div></div>

<div class="foot">
  <button id="btnClear" type="button">Limpar tudo</button>
  <button id="btnShare" type="button">Compartilhar PDF</button>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const PRODUTOS=[["Tubo de 0,40 FMF",150],["Tubo de 0,60 FMF",120],["Tubo de 0,80 FMF",70],["Tubo de 1,00 FMF",60],["Tubo de 1,20 FMF",55],["Tubo de 1,50 FMF",50]];
const PAINEIS=[{id:"L",top:"CONCRETAGEM"},{id:"R",top:"CENTRAL DE BETONEIRAS"}];
const SECOES=[["a",p=>p.top],["b",()=>"ARMAÇÃO"]];
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const $=(s,r=document)=>r.querySelector(s);

function secao(p,s,nome){
  let h=`<table><colgroup><col style="width:17%"><col style="width:41%"><col style="width:11%"><col style="width:15%"><col style="width:16%"></colgroup>
  <tr class="hd"><td>Pista</td><td>Produto</td><td>Meta</td><td>Produção</td><td>Eficiência</td></tr>`;
  PRODUTOS.forEach(([n,m],i)=>{
    const k=`${p.id}${s}${i}`;
    h+=`<tr>${i?"":`<td class="pista" rowspan="6">${nome}</td>`}<td class="nm">${n}</td>
    <td><input type="number" inputmode="numeric" min="0" data-k="m${k}" value="${m}" aria-label="Meta ${n}"></td>
    <td class="in"><input type="number" inputmode="numeric" min="0" data-k="p${k}" aria-label="Produção ${n}"></td>
    <td id="e${k}">0%</td></tr>`;
  });
  return h+`<tr class="team"><td class="e0"></td><td colspan="3">Eficiência da Equipe</td><td id="t${p.id}${s}">0%</td></tr></table>`;
}
$("#panels").innerHTML=PAINEIS.map(p=>`<div class="panel">
  <div class="ref"><span class="lb">Referência:</span><span class="dt"><input type="date" data-k="d${p.id}" aria-label="Data de referência"></span></div>
  ${secao(p,"a",p.top)}<div class="bar"></div>${secao(p,"b","ARMAÇÃO")}
  <div class="obra"><span>Eficiência da Obra</span><b id="o${p.id}">0.0%</b></div></div>`).join("");

const pct=(v,d=0)=>(v*100).toFixed(d).replace(".",",")+"%";
const fmtData=v=>{if(!v)return"";const[a,m,d]=v.split("-");return `${d}-${MES[+m-1]}`};
const hoje=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};

function calc(){
  PAINEIS.forEach(p=>{
    const teams=SECOES.map(([s])=>{
      const effs=PRODUTOS.map((_,i)=>{
        const k=`${p.id}${s}${i}`,m=+$(`[data-k=m${k}]`).value||0,v=+$(`[data-k=p${k}]`).value||0,e=m?v/m:0;
        $("#e"+k).textContent=pct(e);return e;});
      const t=effs.reduce((a,b)=>a+b,0)/effs.length;
      $(`#t${p.id}${s}`).textContent=pct(t);return t;});
    $("#o"+p.id).textContent=pct((teams[0]+teams[1])/2,1);
  });
}

function montarForm(){
  let f="";
  PAINEIS.forEach(p=>{
    SECOES.forEach(([s,nome],si)=>{
      const tit=si?"Armação – "+(p.id==="L"?"Concretagem":"Central"):nome(p);
      f+=`<div class="card ${si?"arm":""}"><h3>${tit}</h3>`;
      PRODUTOS.forEach(([n,m],i)=>{const k=`${p.id}${s}${i}`;
        f+=`<div class="row"><div class="n">${n.replace(" FMF","")}<small>meta: ${m}</small></div>
        <input type="number" inputmode="numeric" min="0" data-f="p${k}" placeholder="0" aria-label="${tit} ${n}"><div class="ef" id="f${k}">0%</div></div>`;});
      f+=`</div>`;});
  });
  $("#form").innerHTML=f;
}
function sync(){
  document.querySelectorAll("[data-f]").forEach(i=>{$(`#sheet [data-k=${i.dataset.f}]`).value=i.value});
  $("#fd").value=$("#fd").value||hoje();
  document.querySelectorAll("#sheet [data-k^=d]").forEach(i=>i.value=$("#fd").value);
  calc();
  PAINEIS.forEach(p=>{SECOES.forEach(([s])=>PRODUTOS.forEach((_,i)=>{const k=`${p.id}${s}${i}`;$("#f"+k).textContent=$("#e"+k).textContent;}));
    $("#r"+p.id).textContent=$("#o"+p.id).textContent;});
  salvar();
}
function salvar(){try{const o={};document.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value);o.date=$("#fd").value;localStorage.setItem("mon-rdo",JSON.stringify(o))}catch(e){}}
function carregar(){let o={};try{o=JSON.parse(localStorage.getItem("mon-rdo")||"{}")}catch(e){}
  document.querySelectorAll("[data-f]").forEach(i=>{if(o[i.dataset.f]!==undefined)i.value=o[i.dataset.f]});
  $("#fd").value=o.date||hoje();}
document.addEventListener("input",e=>{if(e.target.dataset.f||e.target.id==="fd")sync();});
$("#btnClear").onclick=()=>{if(!confirm("Limpar toda a produção digitada?"))return;
  document.querySelectorAll("[data-f]").forEach(i=>i.value="");sync();};

function toast(t,ms=2800){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms)}

async function gerarPDF(){
  const canvas=await html2canvas($("#sheet"),{scale:2,backgroundColor:"#ffffff",windowWidth:1200,onclone:doc=>{
    doc.getElementById("hid").style.cssText="position:static;width:auto;height:auto;overflow:visible";doc.getElementById("sheet").classList.add("pdf");
    doc.querySelectorAll("input").forEach(i=>{
      const s=doc.createElement("span");s.className="v";
      s.textContent=i.type==="date"?fmtData(i.value):i.value;
      if(i.closest(".ref"))s.className="dt";
      i.replaceWith(s);});
  }});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const w=pdf.internal.pageSize.getWidth()-12,h=canvas.height*w/canvas.width;
  pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",6,8,w,h);
  return pdf.output("blob");
}
$("#btnShare").onclick=async()=>{
  const b=$("#btnShare");b.disabled=true;b.textContent="Gerando PDF…";
  try{
    const blob=await gerarPDF();
    const nome=`Monitoramento_Rondonopolis_${$("#fd").value||hoje()}.pdf`;
    const file=new File([blob],nome,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"Monitoramento Unidade Rondonópolis"});}
      catch(err){if(err.name!=="AbortError")throw err;}
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast("Compartilhamento indisponível neste navegador: PDF baixado.");
    }
  }catch(err){console.error(err);toast("Não foi possível gerar o PDF. Verifique a conexão e tente de novo.",4000);}
  b.disabled=false;b.textContent="Compartilhar PDF";
};
montarForm();carregar();sync();
</script>
</body>
</html>
