<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoramento Unidade Rondonópolis – Detalhamento de Produção Diária</title>
<style>
:root{--bg:#e9ecef;--ink:#111;--bar:#404040;--yel:#ffff00;--line:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Calibri,Carlito,Arial,sans-serif;color:var(--ink);padding:10px 8px 84px}
.sheet{background:#fff;max-width:1100px;margin:0 auto;font-size:13px;box-shadow:0 1px 6px #0003}
.sheet.pdf{width:1100px;max-width:none;box-shadow:none}
.head{display:flex;align-items:center;background:#000;color:#fff}
.head img{height:62px;display:block}
.head h1{flex:1;margin:0;text-align:center;font-weight:400;font-size:clamp(14px,3.2vw,22px);padding:0 8px}
.sub{background:var(--bar);color:#fff;text-align:center;font-weight:700;font-size:12px;padding:1px 0;border-top:1px solid #777}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;background:#fff}
.sheet.pdf .panels{grid-template-columns:1fr 1fr}
@media(max-width:760px){.panels{grid-template-columns:1fr;gap:10px 0}.sheet.pdf .panels{grid-template-columns:1fr 1fr;gap:0 8px}}
.ref{display:flex;background:var(--bar);color:#fff;border:1px solid var(--line)}
.ref .lb{width:80px;text-align:center;padding:1px 0;border-right:1px solid #888}
.ref .dt{flex:1;text-align:center;background:var(--bar);color:#fff}
.ref input,.ref span.dt{font:inherit;color:#fff;background:transparent;border:0;text-align:center;width:100%;padding:1px}
.ref input::-webkit-calendar-picker-indicator{filter:invert(1)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{border:1px solid var(--line);padding:0 3px;height:21px;text-align:center;overflow:hidden;white-space:nowrap}
tr.hd td{background:#fff}
tr.hd td:nth-child(2),td.prod{font-weight:700}
td.pista{font-weight:700;font-size:11.5px;white-space:normal;line-height:1.15}
td.nm{font-weight:400}
tr.team td{font-weight:700}
tr.team td.e0{border:0;border-right:1px solid var(--line);border-left:0}
.bar{height:9px;background:var(--bar);border:1px solid var(--line);border-top:0}
.obra{display:flex;background:var(--bar);color:#fff;border:1px solid var(--line)}
.obra span{flex:1;text-align:center;padding:1px 0}
.obra b{width:16%;text-align:center;background:var(--yel);color:#000;font-weight:400;padding:1px 0}
td input,td span.v{width:100%;font:inherit;text-align:center;border:0;background:transparent;padding:0;display:block;height:20px;line-height:20px;color:inherit}
td.in{background:var(--yel)}
td.in input,td.in span.v{font-weight:400}
td input:focus{outline:2px solid #1a73e8;outline-offset:-2px;background:#fffbe0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#fffe;border-top:1px solid #ccc;backdrop-filter:blur(4px)}
button{font:600 15px Calibri,Carlito,Arial,sans-serif;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
#btnShare{background:#0b57d0;color:#fff;flex:1;max-width:360px}
#btnClear{background:#fff;color:#333;border:1px solid #999}
button:disabled{opacity:.6}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* ---- Formulário simples ---- */
.app{max-width:560px;margin:0 auto}
.app h2{margin:4px 0 10px;font-size:22px}
.step{font-size:15px;font-weight:700;color:#333;margin:16px 2px 6px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0002;overflow:hidden;margin-bottom:12px}
.card h3{margin:0;padding:10px 14px;font-size:17px;color:#fff;background:#0b57d0;letter-spacing:.3px}
.card.arm h3{background:#2e7d32}
.grp{background:#222;color:#fff;font-weight:700;font-size:16px;padding:8px 14px;border-radius:10px;margin:14px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #eee}
.row .n{flex:1;font-size:17px;font-weight:600}
.row .n small{display:block;font-weight:400;font-size:13px;color:#666}
.row input{width:96px;height:50px;font-size:24px;font-weight:700;text-align:center;border:2px solid #bbb;border-radius:10px;background:#fffbd0}
.row input:focus{outline:0;border-color:#0b57d0;background:#ffff66}
.row .ef{width:52px;text-align:right;font-size:15px;font-weight:700;color:#555}
.date{width:100%;height:54px;font-size:22px;text-align:center;border:2px solid #bbb;border-radius:10px;background:#fff}
.res{display:flex;gap:8px}
.res div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 4px #0002}
.res b{display:block;font-size:26px;color:#0b57d0}
.res span{font-size:13px;color:#555}
#hid{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#fffe;border-top:1px solid #ccc;backdrop-filter:blur(4px)}
#btnShare{flex:1;max-width:520px;font-size:19px;padding:16px}

[hidden]{display:none!important}
.add{width:100%;font-size:18px;padding:15px;background:#fff;color:#6a1b9a;border:2px dashed #6a1b9a;border-radius:12px;margin:2px 0 6px}
.af{padding:12px 14px;display:grid;gap:10px}
.af label{display:block;font-size:14px;font-weight:700;color:#444}
.af input,.af select{display:block;width:100%;height:48px;margin-top:4px;font:600 18px Calibri,Carlito,Arial,sans-serif;border:2px solid #bbb;border-radius:10px;padding:0 10px;background:#fff}
.af .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.af .note{margin:0;font-size:13px;color:#666}
.af .btns{display:flex;gap:8px}
.af .btns button{flex:1}
#aCancel{background:#fff;border:1px solid #999;color:#333}
#aOk{background:#6a1b9a;color:#fff}
.xrow{padding:10px 14px;border-top:1px solid #eee;background:#faf5ff}
.xt{display:flex;gap:8px}
.xt .xn{flex:1;height:46px;font:700 17px Calibri,Carlito,Arial,sans-serif;border:2px solid #bbb;border-radius:10px;padding:0 10px;min-width:0}
.xd{background:#fff;border:1px solid #c62828;color:#c62828;padding:0 14px;font-size:18px}
.xv{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.xv label{flex:1;font-size:13px;font-weight:700;color:#555}
.xv input{display:block;width:100%;height:50px;margin-top:3px;font-size:22px;font-weight:700;text-align:center;border:2px solid #bbb;border-radius:10px;background:#fffbd0}
.xv .ef{width:52px;text-align:right;font-size:15px;font-weight:700;color:#555;padding-bottom:14px}
.xs{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:8px}
.xs select{display:block;width:100%;height:46px;margin-top:3px;font:700 17px Calibri,Carlito,Arial,sans-serif;border:2px solid #6a1b9a;border-radius:10px;background:#fff;padding:0 8px}
#extras .card h3{background:#6a1b9a}
.warn{color:#b26a00;font-size:14px;font-weight:700;margin-top:6px}

.big{display:block;width:100%;font-size:22px;padding:26px 16px;background:#0b57d0;color:#fff;border-radius:16px;margin:14px 0;box-shadow:0 2px 6px #0003}
.big.alt{background:#2e7d32}
.big.g{background:#fff;color:#222;border:2px solid #bbb;font-size:19px;padding:18px}
.lnk{background:none;color:#0b57d0;padding:8px 6px;font-size:15px;text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;min-height:40px}
.top span{font-size:15px;color:#444;font-weight:600}
.sub2{color:#555;font-size:15px;margin:-4px 0 14px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.flt label{font-size:13px;font-weight:700;color:#555}
.flt input{display:block;width:100%;height:46px;margin-top:3px;font-size:17px;border:2px solid #bbb;border-radius:10px;padding:0 8px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:9px 13px;font-size:14px;background:#fff;border:1px solid #999;border-radius:20px;color:#222}
.pr{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid #eee;font-size:16px}
.pr small{color:#666;font-size:13px}
.pr.tot{font-weight:700;background:#f4f6f8}
.day{display:block;width:100%;text-align:left;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px #0002;color:#111;font-weight:400}
.day b{display:block;font-size:17px}.day span{font-size:14px;color:#555}
.empty{text-align:center;color:#666;padding:24px 8px}
#foot{display:none}#foot.on{display:flex}
#btnSave{background:#2e7d32;color:#fff;flex:1;font-size:18px;padding:16px}
#btnShare{flex:1.3}
.back{background:#fff;color:#0b57d0;border:2px solid #0b57d0;font-size:16px;padding:10px 18px}
#btnShare.off{opacity:.45}

.pg{width:1100px;background:#fff;padding-bottom:4px}
.pg .panels{grid-template-columns:1fr 1fr;margin-top:8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kp div{border:1px solid var(--line)}
.kp i{display:block;font-style:normal;background:var(--bar);color:#fff;font-size:12px;padding:2px;text-align:center}
.kp b{display:block;font-size:26px;padding:5px;text-align:center;background:#fff;font-weight:700}
.rt{margin-top:8px}
.rt thead td{background:var(--bar);color:#fff;font-weight:700;height:38px;line-height:1.15}
.rt thead small{font-weight:400;font-size:11px}
.rt tbody tr:nth-child(even) td{background:#f3f3f3}
.rt tbody tr td.ob{background:var(--yel);font-weight:700}
.rt tbody tr.tt td{background:#d9d9d9;font-weight:700}
.rt tbody tr.tt td.ob{background:var(--yel)}
.pf{text-align:right;font-size:11px;color:#555;padding:6px 8px 0}
#foot2{display:none}#foot2.on{display:flex}
#btnShareP{flex:1;max-width:520px;font-size:19px;padding:16px;background:#0b57d0;color:#fff}
.ok{color:#2e7d32}
#bkDown,#bkUp{font-size:16px;padding:14px 8px}
</style>
</head>
<body>
<div class="app scr" id="scHome">
  <h2>Monitoramento Rondonópolis</h2>
  <button type="button" class="big" id="goForm">📝 Novo formulário</button>
  <button type="button" class="big alt" id="goPainel">📊 Painel</button>
  <div class="card" style="margin-top:22px"><h3 style="background:#555">Cópia de segurança</h3>
    <div style="padding:12px 14px"><p id="bkInfo" style="margin:0 0 10px;font-size:15px;color:#444"></p>
    <div class="flt" style="margin:0"><button type="button" id="bkDown" style="background:#0b57d0;color:#fff">⬇ Baixar dados</button>
    <button type="button" id="bkUp" style="background:#fff;border:2px solid #0b57d0;color:#0b57d0">⬆ Carregar dados</button></div>
    <input type="file" id="bkFile" accept=".json,application/json" hidden></div></div>
</div>

<div class="app scr" id="scForm" hidden>
  <div class="top"><button type="button" class="back" id="backF">‹ Início</button><span id="saveSt"></span></div>
  <h2>Produção do dia</h2>
  <div class="step">1. Data</div>
  <input type="date" class="date" id="fd" aria-label="Data">
  <div class="step">2. Digite quantos tubos foram feitos</div>
  <div id="form"></div>
  <div id="extras"></div>
  <button type="button" class="add" id="btnAdd">+ Adicionar outro produto</button>
  <div class="step">3. Eficiência da obra</div>
  <div class="res"><div><b id="rL">0%</b><span>Concretagem</span></div><div><b id="rR">0%</b><span>Central de Betoneiras</span></div></div>
  <p style="text-align:center"><button type="button" class="lnk" id="btnClear">Limpar este dia</button></p>
</div>

<div class="app scr" id="scPainel" hidden>
  <div class="top"><button type="button" class="back" id="backP">‹ Início</button></div>
  <h2>Painel</h2>
  <div class="flt"><label>De<input type="date" id="pf"></label><label>Até<input type="date" id="pt"></label></div>
  <div class="chips"><button type="button" data-q="hoje">Hoje</button><button type="button" data-q="7">7 dias</button><button type="button" data-q="mes">Este mês</button><button type="button" data-q="tudo">Tudo</button></div>
  <div id="pOut"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const PRODUTOS=[["Tubo de 0,40 FMF",150],["Tubo de 0,60 FMF",120],["Tubo de 0,80 FMF",70],["Tubo de 1,00 FMF",60],["Tubo de 1,20 FMF",55],["Tubo de 1,50 FMF",50]];
const SEC=[{k:"La",pid:"L",pista:"CONCRETAGEM",t:"Concretagem"},{k:"Lb",pid:"L",pista:"ARMAÇÃO",t:"Armação – Concretagem",arm:1},
 {k:"Ra",pid:"R",pista:"CENTRAL DE BETONEIRAS",t:"Central de Betoneiras"},{k:"Rb",pid:"R",pista:"ARMAÇÃO",t:"Armação – Central",arm:1}];
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&"<>]/g,c=>({"&":"&amp;",'"':"&quot;","<":"&lt;",">":"&gt;"}[c]));
const pct=(v,d=0)=>(v*100).toFixed(d).replace(".",",")+"%";
const fmtData=v=>{if(!v)return"";const[a,m,d]=v.split("-");return `${d}-${MES[+m-1]}`};
const dataBR=v=>{const[a,m,d]=v.split("-");return `${d}/${m}/${a}`};
const iso=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const hoje=()=>iso(new Date());
const num=v=>(v===""||v==null)?null:Number(v);
const clone=o=>JSON.parse(JSON.stringify(o));
let S={date:"",p:{},x:[]},DB={days:{}},dirty=false;

/* ---------- cálculo ---------- */
const filled=x=>String(x.n).trim()||num(x.m)!=null||num(x.p)!=null;
function miss(x){const a=[];if(!String(x.n).trim())a.push("nome");if(num(x.m)==null)a.push("meta");if(num(x.p)==null)a.push("produção");return a}
function rows(s,R=S){
  const b=PRODUTOS.map(([n,m],i)=>({n,m,raw:R.p[s.k+i]??"",p:+R.p[s.k+i]||0,i:1}));
  const e=R.x.filter(x=>x.sec===s.k&&filled(x)).map(x=>({n:String(x.n).trim()||"(sem nome)",m:num(x.m)||0,raw:x.p,p:num(x.p)||0,id:x.id,x}));
  return b.concat(e);
}
const eff=r=>r.m>0?r.p/r.m:null;
const avg=a=>{const v=a.filter(e=>e!==null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:0};
function calc(R=S){const T={},O={};SEC.forEach(s=>T[s.k]=avg(rows(s,R).map(eff)));["L","R"].forEach(id=>O[id]=(T[id+"a"]+T[id+"b"])/2);return{T,O}}

/* ---------- formulário ---------- */
function montarForm(){
  $("#form").innerHTML=SEC.map(s=>`<div class="card ${s.arm?"arm":""}"><h3>${s.t}</h3>`+
   PRODUTOS.map(([n,m],i)=>`<div class="row"><div class="n">${n.replace(" FMF","")}<small>meta: ${m}</small></div>
   <input type="number" inputmode="numeric" min="0" data-f="${s.k}${i}" placeholder="0" aria-label="${s.t} ${n}"><div class="ef" id="f${s.k}${i}">0%</div></div>`).join("")+`</div>`).join("");
}
function renderExtras(){
  $("#extras").innerHTML=S.x.map((x,n)=>`<div class="card"><h3>Produto adicionado ${n+1}</h3><div class="xrow">
   <label class="xs">Onde entra na planilha?<select data-x="${x.id}" data-c="sec">${SEC.map(s=>`<option value="${s.k}"${s.k===x.sec?" selected":""}>${s.t}</option>`).join("")}</select></label>
   <div class="xt"><input class="xn" type="text" placeholder="Nome do produto" value="${esc(x.n)}" data-x="${x.id}" data-c="n"><button type="button" class="xd" data-del="${x.id}" aria-label="Remover produto">✕</button></div>
   <div class="xv"><label>Meta<input type="number" inputmode="numeric" min="0" value="${esc(x.m)}" data-x="${x.id}" data-c="m"></label>
   <label>Produção<input type="number" inputmode="numeric" min="0" value="${esc(x.p)}" data-x="${x.id}" data-c="p"></label><div class="ef" id="xe${x.id}">-</div></div>
   <div class="warn" id="xw${x.id}"></div></div></div>`).join("");
}
function sheetSec(s){
  const rs=rows(s),e=rs.map(eff);
  return `<table><colgroup><col style="width:17%"><col style="width:41%"><col style="width:11%"><col style="width:15%"><col style="width:16%"></colgroup>
  <tr class="hd"><td>Pista</td><td>Produto</td><td>Meta</td><td>Produção</td><td>Eficiência</td></tr>`+
  rs.map((r,i)=>`<tr>${i?"":`<td class="pista" rowspan="${rs.length}">${s.pista}</td>`}<td class="nm">${esc(r.n)}</td><td>${r.m||""}</td><td class="in">${esc(r.raw)}</td><td>${e[i]===null?"-":pct(e[i])}</td></tr>`).join("")+
  `<tr class="team"><td class="e0"></td><td colspan="3">Eficiência da Equipe</td><td>${pct(avg(e))}</td></tr></table>`;
}
function renderSheet(O){
  $("#panels").innerHTML=["L","R"].map(id=>{const [a,b]=SEC.filter(s=>s.pid===id);
   return `<div class="panel"><div class="ref"><span class="lb">Referência:</span><span class="dt">${fmtData(S.date)}</span></div>${sheetSec(a)}<div class="bar"></div>${sheetSec(b)}<div class="obra"><span>Eficiência da Obra</span><b>${pct(O[id],1)}</b></div></div>`}).join("");
}
function update(){
  const {O}=calc();
  SEC.forEach(s=>rows(s).forEach((r,i)=>{if(r.i){const e=eff(r);$(`#f${s.k}${i}`).textContent=e===null?"-":pct(e)}}));
  S.x.forEach(x=>{const m=num(x.m)||0,v=num(x.p)||0;$("#xe"+x.id).textContent=m>0?pct(v/m):"-";
    const f=miss(x);$("#xw"+x.id).textContent=filled(x)&&f.length?"⚠ Falta preencher: "+f.join(", "):""});
  $("#rL").textContent=pct(O.L,1);$("#rR").textContent=pct(O.R,1);
  renderSheet(O);
  setSt();
  try{localStorage.setItem("mon-draft",JSON.stringify(S))}catch(e){}
}
const salvo=()=>!dirty&&!!DB.days[S.date];
function setSt(){const e=$("#saveSt"),ok=salvo();e.textContent=ok?"✓ Salvo":"● Não salvo";e.style.color=ok?"#2e7d32":"#b26a00";$("#btnShare").classList.toggle("off",!ok)}
function loadDay(d){
  let dr=null;try{dr=JSON.parse(localStorage.getItem("mon-draft")||"null")}catch(e){}
  const r=DB.days[d]||(dr&&dr.date===d?dr:null)||{p:{},x:[]};
  S={date:d,p:clone(r.p||{}),x:clone(r.x||[])};
  $("#fd").value=d;
  document.querySelectorAll("[data-f]").forEach(i=>i.value=S.p[i.dataset.f]??"");
  renderExtras();dirty=false;update();
}

/* ---------- telas ---------- */
function show(id){document.querySelectorAll(".scr").forEach(e=>e.hidden=e.id!==id);$("#foot").classList.toggle("on",id==="scForm");$("#foot2").classList.toggle("on",id==="scPainel");window.scrollTo(0,0)}
function toast(t,ms=2800){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms)}
function goHome(){infoBackup();show("scHome")}

document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="fd"){
    if(dirty&&!confirm("Tem alterações não salvas neste dia. Trocar de data mesmo assim?")){t.value=S.date;return}
    loadDay(t.value||hoje());return}
  if(t.dataset.f)S.p[t.dataset.f]=t.value;
  else if(t.dataset.x){const x=S.x.find(a=>String(a.id)===t.dataset.x);if(x)x[t.dataset.c]=t.value}
  else return;
  dirty=true;update();});
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-del]");
  if(d){if(!confirm("Remover este produto?"))return;S.x=S.x.filter(a=>String(a.id)!==d.dataset.del);renderExtras();dirty=true;update();return}
  const o=e.target.closest("[data-open]");if(o){loadDay(o.dataset.open);show("scForm");return}
  const q=e.target.closest("[data-q]");if(q)quick(q.dataset.q);});
$("#btnClear").onclick=()=>{if(!confirm("Limpar toda a produção digitada e os produtos adicionados deste dia?"))return;
  S.p={};S.x=[];document.querySelectorAll("[data-f]").forEach(i=>i.value="");renderExtras();dirty=true;update();};
$("#btnAdd").onclick=()=>{const x={id:Date.now(),sec:"La",n:"",m:"",p:""};S.x.push(x);renderExtras();dirty=true;update();
  const el=document.querySelector(`[data-x="${x.id}"][data-c="n"]`);el.scrollIntoView({block:"center"});el.focus();};
$("#goForm").onclick=()=>{loadDay(hoje());show("scForm");if(DB.days[hoje()])toast("Já existe registro de hoje. Carregado para continuar.",3500)};
$("#goPainel").onclick=()=>{if(!$("#pf").value&&!$("#pt").value)quick("mes");else renderPainel();show("scPainel")};
$("#backF").onclick=()=>{if(dirty&&!confirm("Tem informações não salvas. Voltar mesmo assim?"))return;dirty=false;goHome()};
$("#backP").onclick=goHome;
$("#pf").oninput=$("#pt").oninput=renderPainel;
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* ---------- painel ---------- */
function quick(q){
  const t=new Date(),a=new Date();
  if(q==="7")a.setDate(t.getDate()-6);else if(q==="mes")a.setDate(1);
  $("#pf").value=q==="tudo"?"":iso(a);$("#pt").value=q==="tudo"?"":iso(t);
  if(q==="hoje"){$("#pf").value=$("#pt").value=hoje()}
  renderPainel();
}
function dados(){
  const f=$("#pf").value,t=$("#pt").value;
  const ds=Object.keys(DB.days).filter(d=>(!f||d>=f)&&(!t||d<=t)).sort();
  let sL=0,sR=0;const agg={},tS={};SEC.forEach(s=>{agg[s.k]=new Map();tS[s.k]=0});
  const list=ds.map(d=>{const R=DB.days[d],{T,O}=calc(R);sL+=O.L;sR+=O.R;const tot={};
    SEC.forEach(s=>{tS[s.k]+=T[s.k];tot[s.k]=0;rows(s,R).forEach(r=>{tot[s.k]+=r.p;const a=agg[s.k].get(r.n)||{p:0,m:0};a.p+=r.p;a.m+=r.m;agg[s.k].set(r.n,a)})});
    return{d,T,O,tot}});
  return{ds,list,agg,tS,sL,sR,n:ds.length};
}
function renderPainel(){
  const {ds,list,agg,sL,sR,n}=dados();
  if(!n){$("#pOut").innerHTML='<div class="empty">Nenhum registro neste período.</div>';return}
  let h=`<div class="res"><div><b>${n}</b><span>${n===1?"dia registrado":"dias registrados"}</span></div></div>
   <div class="res" style="margin-top:8px"><div><b>${pct(sL/n,1)}</b><span>Obra – Concretagem (média)</span></div><div><b>${pct(sR/n,1)}</b><span>Obra – Central (média)</span></div></div>
   <div class="step">Totais no período</div>`;
  SEC.forEach(s=>{let tot=0,tm=0;
    const r=[...agg[s.k]].map(([nm,a])=>{tot+=a.p;tm+=a.m;return `<div class="pr"><span>${esc(nm.replace(" FMF",""))}<br><small>meta ${a.m}</small></span><span style="text-align:right"><b>${a.p}</b><br><small>${a.m>0?pct(a.p/a.m):"-"}</small></span></div>`}).join("");
    h+=`<div class="card ${s.arm?"arm":""}"><h3>${s.t}</h3>${r}<div class="pr tot"><span>Total produzido</span><span>${tot}</span></div></div>`});
  h+=`<div class="step">Dias (toque para abrir)</div>`+list.reverse().map(x=>`<button type="button" class="day" data-open="${x.d}"><b>${dataBR(x.d)}</b><span>Concretagem ${pct(x.O.L,1)} · Central ${pct(x.O.R,1)}</span></button>`).join("");
  $("#pOut").innerHTML=h;
}

/* ---------- armazenamento no navegador + backup ---------- */
const KEY="mon-db-local";
function carregarDB(){try{DB=JSON.parse(localStorage.getItem(KEY)||"null")||{days:{}}}catch(e){DB={days:{}}}DB.days=DB.days||{}}
async function persist(){localStorage.setItem(KEY,JSON.stringify(DB))}
function infoBackup(){const l=localStorage.getItem("mon-lastbk"),n=Object.keys(DB.days).length;
  $("#bkInfo").innerHTML=`${n} ${n===1?"dia salvo":"dias salvos"} neste aparelho.<br>`+(l?`Último backup: ${dataBR(l)}`:"<b class='warn'>⚠ Ainda não baixou nenhum backup.</b>")}
$("#bkDown").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));
  a.download=`Monitoramento_dados_${hoje()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  localStorage.setItem("mon-lastbk",hoje());infoBackup();toast("Arquivo baixado. Guarde em um lugar seguro.",3500)};
$("#bkUp").onclick=()=>$("#bkFile").click();
$("#bkFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||typeof o.days!=="object")throw 0;const n=Object.keys(o.days).length;
    if(!confirm(`Este arquivo tem ${n} dia(s). Carregar e juntar com os dados deste aparelho?
(Dias com a mesma data serão substituídos pelos do arquivo.)`))return;
    Object.assign(DB.days,o.days);await persist();infoBackup();toast("✓ Dados carregados.")}
  catch(err){toast("Arquivo inválido. Escolha um backup baixado por este aplicativo.",4500)}};

$("#btnSave").onclick=async()=>{
  const b=$("#btnSave");b.disabled=true;b.textContent="Salvando…";
  try{
    DB.days[S.date]={p:clone(S.p),x:clone(S.x.filter(filled))};
    await persist();dirty=false;setSt();
    toast("✓ Salvo neste aparelho.");
  }catch(e){console.error(e);toast("Não foi possível salvar neste aparelho. Baixe um backup e tente de novo.",4500)}
  b.disabled=false;b.textContent="Salvar";
};

/* ---------- PDF ---------- */
function relatorio(){
  const D=dados(),{list,agg,tS,sL,sR,n}=D;
  const logo=$("#sheet .head img").src,g=new Date();
  const per=`${dataBR($("#pf").value||D.ds[0])} a ${dataBR($("#pt").value||D.ds[n-1])}`;
  const ger=`${dataBR(iso(g))} ${String(g.getHours()).padStart(2,"0")}:${String(g.getMinutes()).padStart(2,"0")}`;
  const cab=sub=>`<div class="head"><img alt="" src="${logo}"><h1>MONITORAMENTO UNIDADE RONDONÓPOLIS</h1></div><div class="sub">${sub}</div>`;
  const colg='<colgroup><col style="width:17%"><col style="width:41%"><col style="width:11%"><col style="width:15%"><col style="width:16%"></colgroup>';
  const sec=s=>{const e=[...agg[s.k]];return `<table>${colg}<tr class="hd"><td>Pista</td><td>Produto</td><td>Meta</td><td>Produção</td><td>Eficiência</td></tr>`+
    e.map(([nm,a],i)=>`<tr>${i?"":`<td class="pista" rowspan="${e.length}">${s.pista}</td>`}<td class="nm">${esc(nm)}</td><td>${a.m||""}</td><td class="in">${a.p}</td><td>${a.m>0?pct(a.p/a.m):"-"}</td></tr>`).join("")+
    `<tr class="team"><td class="e0"></td><td colspan="3">Eficiência média da Equipe</td><td>${pct(tS[s.k]/n)}</td></tr></table>`};
  const painel=(id,O)=>{const [a,b]=SEC.filter(s=>s.pid===id);
    return `<div class="panel"><div class="ref"><span class="lb">Período:</span><span class="dt">${per}</span></div>${sec(a)}<div class="bar"></div>${sec(b)}<div class="obra"><span>Eficiência média da Obra</span><b>${pct(O/n,1)}</b></div></div>`};
  const kp=`<div class="kp"><div><i>Dias registrados</i><b>${n}</b></div><div><i>Obra – Concretagem (média)</i><b>${pct(sL/n,1)}</b></div><div><i>Obra – Central de Betoneiras (média)</i><b>${pct(sR/n,1)}</b></div></div>`;
  const cel=(t,e)=>`${t} · ${pct(e)}`;
  const lin=list.map(x=>`<tr><td>${dataBR(x.d)}</td><td>${cel(x.tot.La,x.T.La)}</td><td>${cel(x.tot.Lb,x.T.Lb)}</td><td class="ob">${pct(x.O.L,1)}</td><td>${cel(x.tot.Ra,x.T.Ra)}</td><td>${cel(x.tot.Rb,x.T.Rb)}</td><td class="ob">${pct(x.O.R,1)}</td></tr>`);
  const sm=k=>list.reduce((a,x)=>a+x.tot[k],0);
  lin.push(`<tr class="tt"><td>Período</td><td>${cel(sm("La"),tS.La/n)}</td><td>${cel(sm("Lb"),tS.Lb/n)}</td><td class="ob">${pct(sL/n,1)}</td><td>${cel(sm("Ra"),tS.Ra/n)}</td><td>${cel(sm("Rb"),tS.Rb/n)}</td><td class="ob">${pct(sR/n,1)}</td></tr>`);
  const th=`<thead><tr><td>Data</td><td>Concretagem<br><small>produzido · efic.</small></td><td>Armação<br><small>produzido · efic.</small></td><td>Obra<br><small>Concretagem</small></td><td>Central de Betoneiras<br><small>produzido · efic.</small></td><td>Armação<br><small>produzido · efic.</small></td><td>Obra<br><small>Central</small></td></tr></thead>`;
  const cg='<colgroup><col style="width:12%"><col style="width:15%"><col style="width:15%"><col style="width:14%"><col style="width:15%"><col style="width:15%"><col style="width:14%"></colgroup>';
  const ch=[];for(let i=0;i<lin.length;i+=22)ch.push(lin.slice(i,i+22));
  const tp=1+ch.length,pf=i=>`<div class="pf">Gerado em ${ger} · Página ${i} de ${tp}</div>`;
  let out=`<div class="pg">${cab("RELATÓRIO GERAL DE PRODUÇÃO — "+per)}${kp}<div class="panels">${painel("L",sL)}${painel("R",sR)}</div>${pf(1)}</div>`;
  ch.forEach((c,i)=>out+=`<div class="pg">${cab("DETALHAMENTO POR DIA — "+per)}<table class="rt">${cg}${th}<tbody>${c.join("")}</tbody></table>${pf(i+2)}</div>`);
  return out;
}
async function pdfDe(els){
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  for(let i=0;i<els.length;i++){
    const c=await html2canvas(els[i],{scale:2,backgroundColor:"#ffffff",windowWidth:1200,onclone:doc=>{
      doc.getElementById("hid").style.cssText="position:static;width:auto;height:auto;overflow:visible";
      const s=doc.getElementById("sheet");if(s)s.classList.add("pdf");}});
    let w=285,h=c.height*w/c.width;if(h>198){w=w*198/h;h=198}
    if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",(297-w)/2,6,w,h);
  }
  return pdf.output("blob");
}
async function enviar(blob,nome){
  const file=new File([blob],nome,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:nome.replace(/_/g," ").replace(".pdf","")});}
    catch(err){if(err.name!=="AbortError")throw err;}
  }else{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Compartilhamento indisponível neste navegador: PDF baixado.");
  }
}
$("#btnShareP").onclick=async()=>{
  const D=dados();if(!D.n){toast("Não há registros neste período para gerar o PDF.",3500);return}
  const b=$("#btnShareP");b.disabled=true;b.textContent="Gerando PDF…";
  try{
    $("#rep").innerHTML=relatorio();
    await enviar(await pdfDe([...document.querySelectorAll("#rep .pg")]),`Relatorio_Rondonopolis_${D.ds[0]}_a_${D.ds[D.n-1]}.pdf`);
  }catch(err){console.error(err);toast("Não foi possível gerar o PDF. Verifique a conexão e tente de novo.",4000)}
  $("#rep").innerHTML="";b.disabled=false;b.textContent="Compartilhar PDF do painel";
};
$("#btnShare").onclick=async()=>{
  if(!salvo()){toast("Antes de compartilhar, toque em Salvar.",3500);return}
  const f=S.x.filter(filled).map(x=>({x,m:miss(x)})).filter(a=>a.m.length);
  if(f.length&&!confirm("Atenção, tem produto adicionado com informação faltando:\n\n"+f.map(a=>"• "+(String(a.x.n).trim()||"(sem nome)")+": falta "+a.m.join(", ")).join("\n")+"\n\nGerar o PDF mesmo assim?"))return;
  const b=$("#btnShare");b.disabled=true;b.textContent="Gerando PDF…";
  try{
    await enviar(await pdfDe([$("#sheet")]),`Monitoramento_Rondonopolis_${S.date||hoje()}.pdf`);
  }catch(err){console.error(err);toast("Não foi possível gerar o PDF. Verifique a conexão e tente de novo.",4000);}
  b.disabled=false;b.textContent="Compartilhar PDF";
};
montarForm();carregarDB();goHome();
</script>
</body>
